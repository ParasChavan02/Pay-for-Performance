services:
  # ============================================================================
  # 1. Main API Service (Node.js Express + Mongoose + TypeScript)
  # ============================================================================
  - type: web
    name: p4p-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: Atlas connection string
      - key: FRONTEND_URL
        sync: false # Set to your p4p-web URL (e.g., https://p4p-web.onrender.com)
      - key: PAYMENT_SERVICE_URL
        sync: false # Set to https://p4p-payments.onrender.com/api
      - key: SLA_SERVICE_URL
        sync: false # Set to https://p4p-sla-service.onrender.com

  # ============================================================================
  # 2. Payments Service (Node.js PayPal REST API v2 Gateway)
  # ============================================================================
  - type: web
    name: p4p-payments
    runtime: node
    plan: free
    rootDir: apps/payments
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com

  # ============================================================================
  # 3. SLA Intelligence Service (Python FastAPI + Groq LLM)
  # ============================================================================
  - type: web
    name: p4p-sla-service
    runtime: python
    plan: free
    rootDir: apps/sla-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  # ============================================================================
  # 4. Frontend Web (Next.js Static Site on Render Global CDN)
  # ============================================================================
  - type: web
    name: p4p-web
    runtime: static
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: OUTPUT_EXPORT
        value: "true"
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set to https://p4p-api.onrender.com
